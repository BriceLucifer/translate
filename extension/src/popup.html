<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; padding: 12px; font-family: system-ui, sans-serif; font-size: 13px; }
    label { display: block; margin: 8px 0 2px; color: #555; }
    select { width: 100%; padding: 4px; }
    button { width: 100%; padding: 8px; margin-top: 12px; border: none; border-radius: 6px;
             background: #1a73e8; color: #fff; font-size: 14px; cursor: pointer; }
    button.stop { background: #d93025; }
    #status { margin-top: 10px; font-size: 12px; color: #777; }
    #status.ok { color: #188038; }
    #status.err { color: #d93025; }
  </style>
</head>
<body>
  <label>识别语言</label>
  <select id="lang">
    <option value="" selected>自动检测</option>
    <option value="zh">中文</option>
    <option value="en">English</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
  </select>

  <label>翻译成</label>
  <select id="target">
    <option value="">不翻译</option>
    <option value="zh" selected>中文</option>
    <option value="en">English</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
  </select>

  <button id="toggle">开始字幕</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
